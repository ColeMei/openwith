[package]
name = "openwith-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenWith GUI"

[lib]
name = "openwith_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openwith-core = { path = "../../openwith-core" }
anyhow.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
# The release check's HTTP client: the same reqwest/rustls(ring) setup
# tauri-plugin-updater uses, so it adds no second TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Runtime Dock-icon swap (NSApplication.applicationIconImage); same versions
# tauri already pulls in transitively.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
