name: Pre-release

# Builds the unsigned GUI .dmg on a macOS runner and publishes it as a GitHub
# pre-release, so an rc can reach a reporter without a local Mac build.
on:
  push:
    tags:
      - "v*-rc.*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/openwith-gui/package-lock.json
      # The app's update check compares version strings for equality, so a
      # build that doesn't report its own rc version shows a bogus update.
      - name: Check the tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "openwith-gui") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
      - name: Install frontend deps
        working-directory: crates/openwith-gui
        run: npm ci
      - name: Build the dmg
        working-directory: crates/openwith-gui
        run: npm run tauri build -- --bundles dmg
      # A tag pushed from git gets a new pre-release with the annotated tag's
      # message as notes. A tag made by publishing a release in the web UI
      # already has its release (and notes), so the dmg is attached to it.
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" target/release/bundle/dmg/*.dmg --clobber
          else
            # checkout may leave a lightweight ref; fetch the annotated tag itself.
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
            gh release create "$GITHUB_REF_NAME" --prerelease \
              --title "$GITHUB_REF_NAME" --notes-file notes.md \
              target/release/bundle/dmg/*.dmg
          fi
