name: Release setup check

# Run by hand after setting up or rotating the update key. It runs in the
# `release` environment, so it waits for the same approval a release does,
# and checks the one thing the settings page can't show: that the
# TAURI_SIGNING_PRIVATE_KEY secret (with its password) is the private half of
# plugins.updater.pubkey in tauri.conf.json. A mismatch would sign updates
# that every installed OpenWith refuses.
#
# It signs a scratch file the way release.yml signs a release and verifies
# that against the public key. Nothing is published and the key is never
# printed.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the signer and minisign
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq minisign
          npm install --prefix "$RUNNER_TEMP/signer" --no-save --ignore-scripts \
            --no-audit --no-fund "@tauri-apps/cli@$TAURI_CLI_VERSION"

      - name: The secret matches the app's public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PUBKEY="$(jq -r '.plugins.updater.pubkey // ""' crates/openwith-gui/src-tauri/tauri.conf.json)"
          if [[ -z "$PUBKEY" || "$PUBKEY" == __* ]]; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still the placeholder"
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set on the release environment"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          echo "release key check $(date -u +%FT%TZ)" > scratch.txt
          if ! "$RUNNER_TEMP/signer/node_modules/.bin/tauri" signer sign \
              --app-version 0.0.0 scratch.txt >/dev/null 2>signer.err; then
            # The signer's own message (wrong password, malformed key) names
            # no secret material.
            cat signer.err
            echo "::error::signing failed; check the key and TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$PUBKEY" | base64 -d > updater.pub
          base64 -d < scratch.txt.sig > scratch.minisig
          if ! minisign -V -p updater.pub -m scratch.txt -x scratch.minisig; then
            echo "::error::the secret is not the key whose public half is in tauri.conf.json"
            exit 1
          fi
          echo "OK: the release key matches $(head -1 updater.pub)"
