[package]
name = "openwith"
version = "0.1.1"
edition = "2021"
description = "Manage macOS file extension associations"
license = "MIT"
repository = "https://github.com/ColeMei/openwith"
homepage = "https://github.com/ColeMei/openwith"
keywords = ["macos", "cli", "file-associations", "duti"]
categories = ["command-line-utilities", "os::macos-apis"]

[[bin]]
name = "openwith"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10"
crossterm = "0.28"
ratatui = "0.29"
tabled = "0.17"
